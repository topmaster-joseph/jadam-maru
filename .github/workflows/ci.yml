name: Marketing AI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate and build Marketing AI
        run: npm run build
      - name: Verify EKODI free member workspace, pricing and central authentication
        shell: bash
        run: |
          set -euo pipefail
          for dir in jadam pizzamaru yogurtpurple; do
            file="dist/marketing-ai/$dir/index.html"
            test -f "$file"
            grep -Fq 'id="googleCustomerAuth"' "$file"
            grep -Fq 'https://auth.ekodi.kr/?site=marketing' "$file"
            grep -Fq 'Google로 무료 시작' "$file"
            grep -Fq 'Content-Security-Policy' "$file"
            grep -Fq "hash.get('ekodi_token')" "$file"
            grep -Fq 'verifyOtp({token_hash:tokenHash' "$file"
            grep -Fq 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js' "$file"
            grep -Fq 'https://renzehysxirjilvdxacv.supabase.co' "$file"
            grep -Fq 'https://marketing-api.ekodi.kr' "$file"
            grep -Fq '/api/marketing/domains' "$file"
            grep -Fq 'id="customDomainPanel"' "$file"
            grep -Fq 'id="customDomainForm"' "$file"
            grep -Fq '고객이 소유한 서브도메인' "$file"
            grep -Fq '/api/customer/federated-login' "$file"
            grep -Fq 'CUSTOMER_SESSION_WAIT_MS=12000' "$file"
            grep -Fq 'ekodi-customer-token' "$file"
            if grep -Fq '/api/customer/login' "$file" || grep -Fq '/api/customer/accept-invite' "$file" || grep -Fq 'id="customerAuthOpen"' "$file"; then
              echo "Legacy direct customer auth detected in $file"
              exit 1
            fi
          done

          grep -Fq 'https://jadam.ai.ekodi.kr' scripts/patch-google-first-auth.mjs
          grep -Fq 'https://pizzamaru.ai.ekodi.kr' scripts/patch-google-first-auth.mjs
          grep -Fq 'https://yogurt.ai.ekodi.kr' scripts/patch-google-first-auth.mjs

          hub='dist/marketing-ai/index.html'
          grep -Fq 'id="googleCustomerAuth"' "$hub"
          grep -Fq 'id="freeTrialForm"' "$hub"
          grep -Fq '무료회원 콘텐츠 실습실' "$hub"
          grep -Fq 'Marketing AI basic trial engine' "$hub"
          grep -Fq 'Google로 무료 시작' "$hub"
          grep -Fq 'verifyOtp({token_hash:tokenHash' "$hub"
          grep -Fq 'id="customDomainPanel"' "$hub"
          grep -Fq 'https://marketing-api.ekodi.kr' "$hub"
          grep -Fq '/api/marketing/domains' "$hub"

          # Public hub stays audience-neutral and login-first.
          grep -Fq '나와 우리를 위한 마케팅,<br>필요한 만큼 자유롭게.' "$hub"
          grep -Fq 'id="trialType"' "$hub"
          grep -Fq 'id="trialSubject"' "$hub"
          grep -Fq '개인·크리에이터' "$hub"
          grep -Fq '매장·소상공인' "$hub"
          grep -Fq '기관·공공기관' "$hub"
          grep -Fq '비영리·종교단체' "$hub"
          grep -Fq '모임·협회·커뮤니티' "$hub"
          if grep -Fq 'id="trialStore"' "$hub"; then
            echo 'Store-only trial field leaked back into the Marketing AI hub'
            exit 1
          fi

          # Anonymous visitors may see the preview, but never obtain FREE workspace authority from URL/local state.
          grep -Fq 'data-public-landing-cleanup' "$hub"
          grep -Fq 'body:not(.member-session-mode) .product-preview{display:none!important}' "$hub"
          grep -Fq 'body:not(.member-session-mode) .hero.hero-v2{display:block' "$hub"
          grep -Fq 'body:not(.member-session-mode) .member-preview{max-width:820px' "$hub"
          grep -Fq 'FREE MEMBER · GOOGLE VERIFIED' "$hub"
          grep -Fq 'EKODI_MARKETING_AUTH_TOKEN' "$hub"
          grep -Fq "ekodiAuthState==='authenticated'" "$hub"
          if grep -Fq "localStorage.getItem(KEY)==='1'" "$hub"; then
            echo 'Browser local state must not grant FREE membership'
            exit 1
          fi
          if grep -Fq 'ekodi-marketing-free-usage:' "$hub"; then
            echo 'Browser-local FREE quota survived the server runtime migration'
            exit 1
          fi

          # Server-backed FREE and tier ladder.
          grep -Fq 'class="member-workspace"' "$hub"
          grep -Fq 'id="channelGrid"' "$hub"
          grep -Fq 'id="quotaCaption"' "$hub"
          grep -Fq 'id="quotaPost"' "$hub"
          grep -Fq 'id="quotaShorts"' "$hub"
          grep -Fq 'id="trialTask"' "$hub"
          grep -Fq 'FREE · 연결 잠김' "$hub"
          grep -Fq '채널 1개 · 1회 실행' "$hub"
          grep -Fq '채널 3개 · 예약' "$hub"
          grep -Fq '채널 5개 · 반복·분석' "$hub"
          grep -Fq '채널 10개 · 상시 운영' "$hub"
          grep -Fq 'FREE는 문구·게시글·쇼츠 각각 월 1회' "$hub"
          grep -Fq '/api/marketing/runtime/consume' "$hub"
          grep -Fq '/api/marketing/runtime/channels' "$hub"
          grep -Fq '/api/marketing/runtime/automations' "$hub"
          grep -Fq 'data-member-workspace' "$hub"
          grep -Fq 'free-member-mode' "$hub"
          grep -Fq 'body.free-member-mode .product-preview{display:none!important}' "$hub"
          grep -Fq 'body.free-member-mode .hero.hero-v2{grid-template-columns:minmax(0,1fr)' "$hub"

          # Authenticated members get an application workspace, not the public sales composition.
          grep -Fq 'data-member-session-layout' "$hub"
          grep -Fq 'member-session-mode' "$hub"
          grep -Fq 'body.member-session-mode.member-workspace-ready .hero-copy>h1' "$hub"
          grep -Fq 'body.member-session-mode.member-workspace-ready .product-preview' "$hub"
          grep -Fq 'body.member-session-mode.member-workspace-ready .feature-strip' "$hub"
          grep -Fq 'body.member-session-mode.member-workspace-ready .bottom-cta' "$hub"
          grep -Fq "workspaceLink.textContent=active?'작업공간':'무료 체험'" "$hub"
          grep -Fq "pricingLink.textContent=active?'플랜·자동화':'이용 방식'" "$hub"

          grep -Fq 'id="pricing"' "$hub"
          grep -Fq 'id="usageEstimator"' "$hub"
          grep -Fq 'BEST PLAN AI' "$hub"
          grep -Fq '1회 결제' "$hub"
          grep -Fq '종량제' "$hub"
          grep -Fq '자동화 플랜' "$hub"
          grep -Fq '현재 사용량에는 FLEX가 가장 경제적입니다.' "$hub"
          for plan in free flex plus pro auto; do
            grep -Fq "data-plan=\"$plan\"" "$hub"
          done
          if grep -Fq 'APPLICATION CASES' "$hub" || grep -Fq 'class="case-list"' "$hub"; then
            echo 'Public application-case directory leaked back into the Marketing AI hub'
            exit 1
          fi
          if grep -Fq 'href="https://pay.ekodi.kr' "$hub"; then
            echo 'Live payment CTA must not be enabled while beta pricing is unapproved'
            exit 1
          fi

          grep -Fq 'https://yogurt.ekodi.kr/' dist/marketing-ai/qa/index.html
          if grep -R -Fq 'https://yogurtpurple.ekodi.kr/' dist/marketing-ai; then
            echo 'Legacy yogurtpurple domain detected'
            exit 1
          fi
